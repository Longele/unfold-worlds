<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contes · Unfold Worlds</title>
<meta name="description" content="Des BD à écouter et à toucher, pour les enfants : Lina et le papillon secret, Nala et la fusée en carton, Noé et l’arche, Lina et les petites traces.">
<meta name="theme-color" content="#140a05">
<meta property="og:title" content="Contes pour enfants · Unfold Worlds">
<meta property="og:description" content="Des histoires à écouter et à toucher, pour les enfants.">
<meta property="og:image" content="https://unfoldworlds.com/covers/contes.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23f2b36b%22/%3E%3C/svg%3E">
<style>
@font-face { font-family: 'Cormorant Garamond'; font-weight: 300; src: url(../fonts/cormorant-garamond-latin-300-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Cormorant Garamond'; font-weight: 400; font-style: italic; src: url(../fonts/cormorant-garamond-latin-400-italic.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Cormorant Garamond'; font-weight: 400; src: url(../fonts/cormorant-garamond-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(../fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); font-display: swap; }
:root { --paper: #fbf1e2; --glow: #ffd9a0; --gold: #f2c27a; --bg: #140a05; --serif: 'Cormorant Garamond', Georgia, serif; --mono: 'JetBrains Mono', ui-monospace, monospace; --ease: cubic-bezier(.2, .8, .2, 1); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; color: var(--paper); font-family: var(--serif);
  background: radial-gradient(ellipse 90% 60% at 50% 0%, #4a2412 0%, rgba(74, 36, 18, 0) 70%), var(--bg); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
header { display: flex; justify-content: space-between; align-items: center; padding: max(18px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); }
.brand { font-family: var(--mono); font-size: 10px; letter-spacing: .4em; color: rgba(251, 241, 226, .6); }
.langs { display: flex; gap: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: .2em; }
.langs button { padding: 7px 10px; border-radius: 999px; background: rgba(251, 241, 226, .06); }
.langs button.on { background: var(--paper); color: #2a140a; }
main { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }
.hero { text-align: center; padding: clamp(40px, 9vh, 96px) 0 clamp(30px, 6vh, 64px); }
.kick { margin: 0 0 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .4em; text-transform: uppercase; color: var(--glow); }
h1 { margin: 0; font-weight: 300; font-size: clamp(54px, 9vw, 120px); line-height: .95; letter-spacing: .02em; }
h1 em { display: block; font-style: italic; font-weight: 400; font-size: .42em; color: var(--glow); margin-top: 14px; }
.lead { max-width: 560px; margin: 22px auto 0; font-size: clamp(19px, 2vw, 23px); line-height: 1.45; opacity: .8; }
.series { margin-top: clamp(36px, 7vh, 70px); }
.series h2 { display: flex; align-items: baseline; gap: 14px; margin: 0 0 6px; font-weight: 400; font-style: italic; font-size: clamp(30px, 3.6vw, 44px); }
.series h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(242, 194, 122, .5), transparent); transform: translateY(-8px); }
.series p.sd { margin: 0 0 22px; font-size: 18px; opacity: .65; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); gap: 22px; }
.tale { position: relative; display: block; border-radius: 18px; overflow: hidden; background: #2a160b; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); transform: translateZ(0); transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
.tale .im { aspect-ratio: 16 / 10; background-size: cover; background-position: 50% 50%; transition: transform 1.2s var(--ease); }
.tale::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 10, 5, 0) 35%, rgba(20, 10, 5, .92) 100%); pointer-events: none; }
.tale .tx { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 20px 22px; }
.tale h3 { margin: 0; font-weight: 400; font-size: 30px; line-height: 1.05; }
.tale h3 em { display: block; font-size: .62em; color: var(--glow); margin-top: 4px; }
.tale .meta { margin-top: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; opacity: .7; }
.tale.soon { pointer-events: none; }
.tale.soon .im { filter: saturate(.5) brightness(.55); }
.tale .badge { position: absolute; top: 14px; left: 14px; z-index: 1; padding: 6px 11px; border-radius: 999px; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; background: rgba(20, 10, 5, .7); border: 1px solid rgba(251, 241, 226, .2); }
@media (hover: hover) { .tale:hover { transform: translateY(-6px); box-shadow: 0 34px 80px rgba(0, 0, 0, .55); } .tale:hover .im { transform: scale(1.04); } }
footer { text-align: center; padding: 0 20px 40px; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .45; }
footer a { border-bottom: 1px solid rgba(251, 241, 226, .3); }
</style>
</head>
<body>
<header>
  <a class="brand" href="../">UNFOLD WORLDS</a>
  <div class="langs"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
</header>
<main>
  <section class="hero">
    <p class="kick" data-t="kick"></p>
    <h1><span data-t="title"></span><em data-t="sub"></em></h1>
    <p class="lead" data-t="lead"></p>
  </section>
  <div id="series"></div>
</main>
<footer><a href="../" data-t="home"></a></footer>
<script>
const T = {
  fr: { kick: 'Unfold Worlds', title: 'Contes', sub: 'à écouter et à toucher', lead: 'Des histoires racontées à voix haute, que l’enfant fait avancer du bout du doigt. Quelques minutes chacune, en français et en anglais.', home: 'Retour à l’accueil', min: 'min', soon: 'Bientôt', play: 'Écouter' },
  en: { kick: 'Unfold Worlds', title: 'Stories', sub: 'to listen to and to touch', lead: 'Tales read aloud, that the child moves along with a fingertip. A few minutes each, in French and in English.', home: 'Back to home', min: 'min', soon: 'Coming soon', play: 'Listen' },
};
// the series and their tales; a tale without "url" shows as coming soon
const SERIES = [
  // one series per hero, the episodes in order
  { id: 'lina', fr: { name: 'Lina', d: 'Une petite exploratrice, sa loupe et ses jumelles : chaque histoire est une enquête dans la nature.' }, en: { name: 'Lina', d: 'A little explorer with her magnifying glass and binoculars: every story is an investigation in nature.' },
    tales: [{ url: 'lina/', img: 'lina/art/l10.jpg', min: 5, fr: { t: 'Lina', s: 'et les petites traces', m: 'Épisode 1 · BD à toucher · 4 à 8 ans' }, en: { t: 'Lina', s: 'and the tiny tracks', m: 'Episode 1 · Interactive comic · ages 4 to 8' } },
      { url: 'lina2/', img: 'lina2/art/b5b.jpg', min: 6, fr: { t: 'Lina', s: 'et le papillon secret', m: 'Épisode 2 · BD à vivre · 4 à 8 ans' }, en: { t: 'Lina', s: 'and the secret butterfly', m: 'Episode 2 · Interactive comic · ages 4 to 8' } }] },
  { id: 'nala', fr: { name: 'Nala', d: 'Une petite astronaute et Bip, son robot en carton, partent explorer l’espace.' }, en: { name: 'Nala', d: 'A little astronaut and Bip, her cardboard robot, set off to explore space.' },
    tales: [{ url: 'nala/', img: 'nala/art/k3.jpg', min: 6, fr: { t: 'Nala', s: 'et la fusée en carton', m: 'Épisode 1 · BD à vivre · 4 à 8 ans' }, en: { t: 'Nala', s: 'and the cardboard rocket', m: 'Episode 1 · Interactive comic · ages 4 to 8' } },
      { url: 'nala2/', img: 'nala2/art/m6.jpg', min: 7, fr: { t: 'Nala', s: 'et la planète rouge', m: 'Épisode 2 · BD à vivre · 4 à 8 ans' }, en: { t: 'Nala', s: 'and the red planet', m: 'Episode 2 · Interactive comic · ages 4 to 8' } }] },
  { id: 'bible', fr: { name: 'Histoires de la Bible', d: 'Les grands récits de la Bible, à vivre en BD, avec un peu de science en chemin.' }, en: { name: 'Bible stories', d: 'The great stories of the Bible as comics, with a little science along the way.' },
    tales: [{ url: 'noe/', img: 'noe/art/n5.jpg', min: 4, fr: { t: 'Noé', s: 'et l’arche', m: 'BD à toucher · Genèse 6 à 9' }, en: { t: 'Noah', s: 'and the ark', m: 'Interactive comic · Genesis 6 to 9' } }] },
  // kept aside for now (not listed): mila/ "Mila et la luciole perdue" and kalulu/ "Kalulu et le grand tir à la corde"
];
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let lang = new URLSearchParams(location.search).get('lang') || store.get('contes-lang') || ((navigator.language || '').startsWith('fr') ? 'fr' : 'en');
function render() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[lang][el.dataset.t];
  for (const b of document.querySelectorAll('[data-lang]')) b.classList.toggle('on', b.dataset.lang === lang);
  document.getElementById('series').innerHTML = SERIES.map((s) => `
    <section class="series"><h2>${s[lang].name}</h2><p class="sd">${s[lang].d}</p><div class="grid">
      ${s.tales.map((x) => `<a class="tale${x.url ? '' : ' soon'}" ${x.url ? `href="${x.url}?lang=${lang}"` : 'aria-disabled="true"'}>
        <div class="im" style="background-image:url(${x.img})"></div>${x.url ? '' : `<span class="badge">${T[lang].soon}</span>`}
        <div class="tx"><h3>${x[lang].t}<em>${x[lang].s}</em></h3><div class="meta">${x[lang].m} · ${x.min} ${T[lang].min}</div></div></a>`).join('')}
    </div></section>`).join('');
}
for (const b of document.querySelectorAll('[data-lang]')) b.onclick = () => { lang = b.dataset.lang; store.set('contes-lang', lang); render(); };
render();
</script>
</body>
</html>
