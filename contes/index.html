<style>

:root { --paper: #fbf1e2; --glow: #ffd9a0; --gold: #f2c27a; --bg: #140a05; --serif: 'Cormorant Garamond', Georgia, serif; --mono: 'JetBrains Mono', ui-monospace, monospace; --ease: cubic-bezier(.2, .8, .2, 1); }

.right { display: flex; align-items: center; gap: 10px; }

.offbar { display: none; max-width: 560px; margin: 26px auto 0; padding: 12px 16px; border-radius: 16px; background: rgba(251, 241, 226, .06); border: 1px solid rgba(251, 241, 226, .12); font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; align-items: center; justify-content: space-between; gap: 12px; }

.offbar button { padding: 8px 12px; border-radius: 999px; background: var(--paper); color: #2a140a; font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
.offbar button[hidden] { display: none; }
.dl { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; align-items: center; gap: 7px; padding: 7px 11px 7px 9px; border-radius: 999px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; background: rgba(20, 10, 5, .72); border: 1px solid rgba(251, 241, 226, .22); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.dl svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.dl.ready { color: #9fe3b0; border-color: rgba(159, 227, 176, .4); pointer-events: none; }
.dl.busy { pointer-events: none; }
.dl .ring { width: 15px; height: 15px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p, 0) * 1turn), rgba(251, 241, 226, .2) 0); }
body.offline .tale.net { pointer-events: none; }
body.offline .tale.net .im { filter: saturate(.3) brightness(.45); }
.priv { text-align: center; margin: 0 0 18px; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .45; }
.apk { display: none; align-items: center; gap: 12px; margin: 26px auto 0; padding: 12px 22px 12px 16px; border-radius: 999px; background: var(--gold); color: #2a140a; text-align: left; box-shadow: 0 14px 34px rgba(0, 0, 0, .35); }
.apk.on { display: inline-flex; }
.apk svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.apk b { display: block; font-weight: 400; font-size: 21px; line-height: 1.1; }
.apk small { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; opacity: .7; margin-top: 3px; }
.sheet { position: fixed; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; background: rgba(10, 5, 2, .6); }
.sheet.on { display: flex; }
.sheet .in { width: min(520px, 100%); padding: 26px 24px calc(26px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; background: #2a160b; border: 1px solid rgba(251, 241, 226, .15); text-align: center; }
.sheet h3 { margin: 0 0 14px; font-weight: 400; font-style: italic; font-size: 30px; }
.sheet ol { text-align: left; margin: 0 auto 20px; padding-left: 22px; max-width: 360px; font-size: 20px; line-height: 1.5; }
.sheet .ok { padding: 12px 26px; border-radius: 999px; background: var(--gold); color: #2a140a; font-size: 18px; }
</style>

<header>

  <div class="right"><button class="inst" id="inst" data-t="install"></button><div class="langs"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div></div>
</header>
<main>

    <a class="apk" id="apk" href="android/Contes.apk" download="Contes.apk"><svg viewBox="0 0 24 24"><path d="M7.5 9.5h9v7.5a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 7.5 17zM7.5 8.5a4.5 4.5 0 0 1 9 0zM9.5 5L8.5 3.5M14.5 5l1-1.5M5.5 10v5M18.5 10v5M10 18.5V21M14 18.5V21"/></svg><span><b data-t="apk"></b><small data-t="apksub"></small></span></a>

<script type="module">
import { register, files, status, download, standalone, ios, canOffline } from './offline.js';
const T = {
  fr: { kick: 'Unfold Worlds', title: 'Contes', sub: 'à écouter et à toucher', lead: 'Des histoires racontées à voix haute, que l’enfant fait avancer du bout du doigt. Quelques minutes chacune, en français et en anglais.', home: 'Retour à l’accueil', min: 'min', soon: 'Bientôt', play: 'Écouter',
    priv: 'Confidentialité', apk: 'Télécharger pour Android', apksub: 'Appli gratuite · 5 Mo', install: 'Installer l’appli', dl: 'Télécharger', ready: 'Sur le téléphone', net: 'Réseau requis', mb: 'Mo', all: 'Tout télécharger', of: 'sur', offline: 'hors ligne', allok: 'Tout est sur le téléphone',
    ios1: 'Touche <b>Partager</b> en bas de Safari', ios2: 'Choisis <b>Sur l’écran d’accueil</b>', ios3: 'L’icône <b>Contes</b> s’ouvre en plein écran' },
  en: { kick: 'Unfold Worlds', title: 'Stories', sub: 'to listen to and to touch', lead: 'Tales read aloud, that the child moves along with a fingertip. A few minutes each, in French and in English.', home: 'Back to home', min: 'min', soon: 'Coming soon', play: 'Listen',
    priv: 'Privacy', apk: 'Download for Android', apksub: 'Free app · 5 MB', install: 'Install the app', dl: 'Download', ready: 'On this phone', net: 'Needs a network', mb: 'MB', all: 'Download all', of: 'of', offline: 'offline', allok: 'Everything is on this phone',
    ios1: 'Tap <b>Share</b> at the bottom of Safari', ios2: 'Choose <b>Add to Home Screen</b>', ios3: 'The <b>Contes</b> icon opens in full screen' },
};
// the series and their tales; a tale without "url" shows as coming soon
const SERIES = [
  // one series per hero, the episodes in order
  { id: 'lina', fr: { name: 'Lina', d: 'Une petite exploratrice, sa loupe et ses jumelles : chaque histoire est une enquête dans la nature.' }, en: { name: 'Lina', d: 'A little explorer with her magnifying glass and binoculars: every story is an investigation in nature.' },
    tales: [{ url: 'lina/', img: 'lina/art/l10.jpg', min: 5, fr: { t: 'Lina', s: 'et les petites traces', m: 'Épisode 1 · BD à toucher · 4 à 8 ans' }, en: { t: 'Lina', s: 'and the tiny tracks', m: 'Episode 1 · Interactive comic · ages 4 to 8' } },
      { url: 'lina2/', img: 'lina2/art/b5b.jpg', min: 6, fr: { t: 'Lina', s: 'et le papillon secret', m: 'Épisode 2 · BD à vivre · 4 à 8 ans' }, en: { t: 'Lina', s: 'and the secret butterfly', m: 'Episode 2 · Interactive comic · ages 4 to 8' } }] },
  { id: 'nala', fr: { name: 'Nala', d: 'Une petite astronaute et Bip, son robot en carton, partent explorer l’espace.' }, en: { name: 'Nala', d: 'A little astronaut and Bip, her cardboard robot, set off to explore space.' },
    tales: [{ url: 'nala/', img: 'nala/art/k3.jpg', min: 6, fr: { t: 'Nala', s: 'et la fusée en carton', m: 'Épisode 1 · BD à vivre · 4 à 8 ans' }, en: { t: 'Nala', s: 'and the cardboard rocket', m: 'Episode 1 · Interactive comic · ages 4 to 8' } },
      { url: 'nala2/', img: 'nala2/art/m6.jpg?v=2', min: 7, fr: { t: 'Nala', s: 'et la planète rouge', m: 'Épisode 2 · BD à vivre · 4 à 8 ans' }, en: { t: 'Nala', s: 'and the red planet', m: 'Episode 2 · Interactive comic · ages 4 to 8' } }] },
  { id: 'bible', fr: { name: 'Histoires de la Bible', d: 'Les grands récits de la Bible, à vivre en BD, avec un peu de science en chemin.' }, en: { name: 'Bible stories', d: 'The great stories of the Bible as comics, with a little science along the way.' },
    tales: [{ url: 'noe/', img: 'noe/art/n5.jpg', min: 4, fr: { t: 'Noé', s: 'et l’arche', m: 'BD à toucher · Genèse 6 à 9' }, en: { t: 'Noah', s: 'and the ark', m: 'Interactive comic · Genesis 6 to 9' } },
      { url: 'jonas/', img: 'jonas/art/j13.jpg', min: 9, fr: { t: 'Jonas', s: 'et le grand poisson', m: 'BD à vivre · livre de Jonas' }, en: { t: 'Jonah', s: 'and the great fish', m: 'Interactive comic · book of Jonah' } }] },
  // kept aside for now (not listed): mila/ "Mila et la luciole perdue" and kalulu/ "Kalulu et le grand tir à la corde"
];
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let lang = new URLSearchParams(location.search).get('lang') || store.get('contes-lang') || ((navigator.language || '').startsWith('fr') ? 'fr' : 'en');
function render() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[lang][el.dataset.t];
  for (const el of document.querySelectorAll('[data-h]')) el.innerHTML = T[lang][el.dataset.h];
  for (const b of document.querySelectorAll('[data-lang]')) b.classList.toggle('on', b.dataset.lang === lang);
  document.getElementById('series').innerHTML = SERIES.map((s) => `
    <section class="series"><h2>${s[lang].name}</h2><p class="sd">${s[lang].d}</p><div class="grid">
      ${s.tales.map((x) => `<a class="tale${x.url ? '' : ' soon'}" data-id="${(x.url || '').replace('/', '')}" ${x.url ? `href="${x.url}?lang=${lang}"` : 'aria-disabled="true"'}>${x.url ? '<button class="dl" hidden></button>' : ''}
        <div class="im" style="background-image:url(${x.img})"></div>${x.url ? '' : `<span class="badge">${T[lang].soon}</span>`}
        <div class="tx"><h3>${x[lang].t}<em>${x[lang].s}</em></h3><div class="meta">${x[lang].m} · ${x.min} ${T[lang].min}</div></div></a>`).join('')}
    </div></section>`).join('');
}
for (const b of document.querySelectorAll('[data-lang]')) b.onclick = () => { lang = b.dataset.lang; store.set('contes-lang', lang); render(); };
render();

// ------------------------------------------------------------------ the app: installed on the phone, stories kept offline
if (standalone) document.body.classList.add('app');
const ICON = { dl: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>', ok: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>' };
const mb = (b) => `${Math.max(1, Math.round(b / 1e6))} ${T[lang].mb}`;
let F = null; const state = {};
function chip(t) {
  const el = document.querySelector(`.tale[data-id="${t.id}"] .dl`); if (!el) return;
  const st = state[t.id]; el.hidden = !canOffline; el.className = 'dl' + (st === 'ready' ? ' ready' : typeof st === 'number' ? ' busy' : '');
  el.innerHTML = st === 'ready' ? `${ICON.ok}${T[lang].ready}` : typeof st === 'number' ? `<i class="ring" style="--p:${st}"></i>${Math.round(st * 100)} %` : `${ICON.dl}${mb(t.size)}`;
  el.closest('.tale').classList.toggle('net', st !== 'ready');
}
function bar() {
  const ts = F?.tales || [], n = ts.filter((t) => state[t.id] === 'ready').length, left = ts.filter((t) => state[t.id] !== 'ready');
  document.getElementById('offbar').classList.toggle('on', canOffline && ts.length > 0);
  document.getElementById('offtxt').textContent = left.length ? `${n} ${T[lang].of} ${ts.length} ${T[lang].offline}` : T[lang].allok;
  const b = document.getElementById('dlall'); b.hidden = !left.length || !navigator.onLine || left.some((t) => typeof state[t.id] === 'number'); b.textContent = `${T[lang].all} · ${mb(left.reduce((s, t) => s + t.size, 0))}`;
}
const paint = () => { for (const t of F?.tales || []) chip(t); bar(); };
async function get(t) {
  if (typeof state[t.id] === 'number' || !navigator.onLine) return;
  state[t.id] = 0; paint();
  try { await download(t, (p) => { state[t.id] = p; chip(t); }); state[t.id] = 'ready'; } catch (e) { console.warn(e); state[t.id] = 'none'; }
  paint();
}
document.getElementById('series').addEventListener('click', (e) => {
  const b = e.target.closest('.dl'); if (!b) return; e.preventDefault(); e.stopPropagation();
  const t = F.tales.find((x) => x.id === b.closest('.tale').dataset.id); if (t) get(t);
}, true);
document.getElementById('dlall').onclick = async () => { for (const t of F.tales) if (state[t.id] !== 'ready') await get(t); };
const net = () => { document.body.classList.toggle('offline', !navigator.onLine); if (F) bar(); };
addEventListener('online', net); addEventListener('offline', net); net();
const _render = render; render = function () { _render(); paint(); };
(async () => {
  if (!canOffline) return;
  await register(); F = await files(); if (!F.tales) return;
  for (const t of F.tales) state[t.id] = await status(t);
  paint();
  for (const t of F.tales) if (state[t.id] === 'old') get(t); // a story changed: the new version replaces the old one by itself
})();
// install: Android offers its own prompt; on the iPhone, the steps through Safari's Share menu
let deferred = null; const inst = document.getElementById('inst');
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; if (!/Android/.test(navigator.userAgent)) inst.classList.add('on'); });
addEventListener('appinstalled', () => inst.classList.remove('on'));
if (ios && !standalone) inst.classList.add('on');
if (!ios) document.getElementById('apk').classList.add('on'); // Android phones and computers: the Android app
inst.onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; inst.classList.remove('on'); } else document.getElementById('iosheet').classList.add('on'); };
document.getElementById('iosok').onclick = () => document.getElementById('iosheet').classList.remove('on');
window.__contes = { state, get files() { return F; }, get };
</script>
