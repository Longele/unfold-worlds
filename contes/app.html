<style>
@font-face { font-family: 'Fredoka'; font-weight: 500 700; src: url(fonts/fredoka.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Nunito'; font-weight: 600 900; src: url(fonts/nunito.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Bangers'; src: url(fonts/bangers.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Comic Neue'; font-weight: 400; src: url(fonts/comicneue-400.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Comic Neue'; font-weight: 700; src: url(fonts/comicneue-700.woff2) format('woff2'); font-display: swap; }
:root {
  --bg: #1c0f08; --bg2: #2a170c; --card: #34200f; --line: rgba(255, 236, 210, .12); --ink: #fff4e4; --dim: rgba(255, 244, 228, .62);
  --sun: #ffc44d; --sun2: #ff9f2e; --mint: #8fe3b0; --sky: #7cc7ff;
  --title: 'Bangers', 'Comic Neue', system-ui, sans-serif; --ui: 'Comic Neue', system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font-family: var(--ui); font-weight: 700; overscroll-behavior-y: none;
  background: radial-gradient(120% 50% at 50% -10%, #5a2d12 0%, rgba(90, 45, 18, 0) 70%), var(--bg); -webkit-user-select: none; user-select: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
.press { transition: transform .18s var(--ease); } .press:active { transform: scale(.96); }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------------------------------------------------------------- app frame */
#app { max-width: 620px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding-bottom: calc(88px + var(--sb)); }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: calc(14px + var(--st)) 18px 12px; background: linear-gradient(180deg, var(--bg) 70%, rgba(28, 15, 8, 0)); }
.top .logo { width: 42px; height: 42px; border-radius: 13px; background: url(icon-192.png) center/cover; box-shadow: 0 6px 16px rgba(0, 0, 0, .4), 0 0 0 2px rgba(255, 196, 77, .5); }
.top .hi { flex: 1; min-width: 0; }
.top .hi small { display: block; font-size: 14px; color: var(--dim); font-weight: 400; }
.top .hi b { display: block; font-family: var(--title); font-weight: 400; font-size: 27px; letter-spacing: .04em; line-height: 1; }
.seg { display: flex; padding: 3px; border-radius: 999px; background: rgba(255, 244, 228, .08); border: 1px solid var(--line); }
.seg button { padding: 7px 12px; border-radius: 999px; font-size: 14px; color: var(--dim); }
.seg button.on { background: var(--ink); color: #2a140a; }
.view { display: none; padding: 0 0 20px; animation: in .35s var(--ease); }
.view.on { display: block; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } }
.offline-note { display: none; margin: 0 18px 14px; padding: 10px 14px; border-radius: 14px; background: rgba(124, 199, 255, .12); border: 1px solid rgba(124, 199, 255, .3); font-size: 15px; align-items: center; gap: 10px; }
body.offline .offline-note { display: flex; }

/* ---------------------------------------------------------------- stories tab */
.hero { position: relative; display: block; margin: 4px 18px 8px; border-radius: 26px; overflow: hidden; aspect-ratio: 4 / 3.4; background: var(--card); box-shadow: 0 22px 50px rgba(0, 0, 0, .5); }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28, 15, 8, 0) 35%, rgba(28, 15, 8, .95) 100%); }
.hero .tx { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 18px 96px 20px 20px; }
.hero .kick { display: inline-block; padding: 5px 11px; border-radius: 999px; background: var(--sun); color: #2a140a; font-size: 13px; margin-bottom: 10px; }
.hero h2 { margin: 0; font-family: var(--title); font-weight: 400; font-size: 40px; letter-spacing: .03em; line-height: .95; }
.hero h2 em { display: block; font-style: normal; font-family: var(--ui); font-size: 18px; letter-spacing: 0; color: var(--sun); margin-top: 6px; }
.hero .play { position: absolute; right: 18px; bottom: 20px; z-index: 2; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: #2a140a; box-shadow: 0 10px 26px rgba(255, 159, 46, .45); }
.hero .play svg { width: 28px; height: 28px; fill: currentColor; stroke: none; margin-left: 4px; }
.rail { margin-top: 26px; }
.rail-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 18px; }
.rail-h h3 { margin: 0; font-family: var(--title); font-weight: 400; font-size: 28px; letter-spacing: .04em; }
.rail-h span { font-size: 14px; color: var(--dim); font-weight: 400; }
.rail p { margin: 4px 18px 12px; font-size: 15px; color: var(--dim); font-weight: 400; line-height: 1.35; }
.row { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 18px 14px; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.card { position: relative; flex: 0 0 min(46%, 210px); scroll-snap-align: start; border-radius: 22px; overflow: hidden; aspect-ratio: 3 / 4.4; background: var(--card); box-shadow: 0 16px 34px rgba(0, 0, 0, .45); }
.card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28, 15, 8, 0) 45%, rgba(28, 15, 8, .96) 100%); }
.card .tx { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 12px 13px 13px; }
.card h4 { margin: 0; font-family: var(--title); font-weight: 400; font-size: 25px; letter-spacing: .04em; line-height: 1; }
.card h4 em { display: block; font-style: normal; font-family: var(--ui); font-size: 14px; letter-spacing: 0; color: var(--sun); margin-top: 4px; line-height: 1.15; }
.card .meta { display: flex; gap: 6px; margin-top: 9px; font-size: 12px; }
.chip { padding: 4px 8px; border-radius: 999px; background: rgba(255, 244, 228, .14); white-space: nowrap; }
.card .ep { position: absolute; top: 10px; left: 10px; z-index: 1; }
.card .st { position: absolute; top: 10px; right: 10px; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(28, 15, 8, .7); border: 1px solid var(--line); }
.card .st svg { width: 17px; height: 17px; }
.card .st.ready { color: var(--mint); border-color: rgba(143, 227, 176, .5); }
.card .st .ring { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--sun) calc(var(--p, 0) * 1turn), rgba(255, 244, 228, .2) 0); }
.card .prog { position: absolute; left: 12px; right: 12px; bottom: 8px; z-index: 2; height: 5px; border-radius: 9px; background: rgba(255, 244, 228, .22); overflow: hidden; }
.card .prog i { display: block; height: 100%; background: var(--sun); border-radius: inherit; }
.chip.new { background: #ff6f91; color: #fff; }
.chip.done { background: var(--mint); color: #12301c; }
.hero .bar { height: 6px; border-radius: 9px; background: rgba(255, 244, 228, .22); margin-top: 12px; width: 62%; overflow: hidden; } .hero .bar i { display: block; height: 100%; background: var(--sun); }
.album { margin: 26px 18px 0; padding: 16px; border-radius: 22px; background: linear-gradient(135deg, #3b2210, #2a170c); border: 1px solid var(--line); }
.album .h { display: flex; justify-content: space-between; align-items: baseline; }
.album h3 { margin: 0; font-family: var(--title); font-weight: 400; font-size: 26px; letter-spacing: .04em; }
.album .h span { color: var(--sun); font-size: 16px; }
.album p { margin: 4px 0 12px; color: var(--dim); font-weight: 400; font-size: 14px; }
.stickers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.stickers i { aspect-ratio: 1; border-radius: 50%; background: rgba(255, 244, 228, .08) center/cover; border: 3px dashed rgba(255, 244, 228, .22); display: grid; place-items: center; font-style: normal; font-size: 18px; color: rgba(255, 244, 228, .35); }
.stickers i.got { border: 3px solid #fff; box-shadow: 0 6px 14px rgba(0, 0, 0, .45); transform: rotate(-6deg); color: transparent; }
.stickers i.got:nth-child(even) { transform: rotate(5deg); }
.namein { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 244, 228, .06); color: var(--ink); font: 700 18px var(--ui); }
body.offline .card.net, body.offline .hero.net { filter: grayscale(.85) brightness(.55); }

/* ---------------------------------------------------------------- offline tab */
.ttl { margin: 6px 18px 4px; font-family: var(--title); font-weight: 400; font-size: 34px; letter-spacing: .04em; }
.sub { margin: 0 18px 16px; color: var(--dim); font-weight: 400; font-size: 16px; line-height: 1.4; }
.meter { margin: 0 18px 18px; padding: 16px; border-radius: 20px; background: var(--bg2); border: 1px solid var(--line); }
.meter .bar { height: 10px; border-radius: 999px; background: rgba(255, 244, 228, .1); overflow: hidden; margin: 10px 0 12px; }
.meter .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--sun2), var(--sun)); transition: width .5s var(--ease); }
.meter .line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 16px; background: var(--sun); color: #2a140a; font-size: 17px; box-shadow: 0 10px 24px rgba(255, 159, 46, .25); }
.btn.ghost { background: rgba(255, 244, 228, .08); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.full { width: 100%; }
.list { margin: 0 18px; display: grid; gap: 10px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 18px; background: var(--bg2); border: 1px solid var(--line); }
.item .th { width: 58px; height: 74px; border-radius: 12px; background: var(--card) center/cover; flex: none; }
.item .tx { flex: 1; min-width: 0; }
.item .tx b { display: block; font-size: 17px; line-height: 1.15; }
.item .tx small { display: block; margin-top: 3px; font-size: 13px; color: var(--dim); font-weight: 400; }
.item .act { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: rgba(255, 244, 228, .08); flex: none; }
.item .act.ready { color: var(--mint); }
.item .act.del { color: #ffb3a1; }
.item .act .ring { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--sun) calc(var(--p, 0) * 1turn), rgba(255, 244, 228, .2) 0); }

/* ---------------------------------------------------------------- parents tab */
.box { margin: 0 18px 14px; padding: 16px; border-radius: 20px; background: var(--bg2); border: 1px solid var(--line); }
.box h4 { margin: 0 0 6px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.box p { margin: 0 0 12px; color: var(--dim); font-weight: 400; font-size: 15px; line-height: 1.45; }
.box p:last-child { margin-bottom: 0; }
.box ol { margin: 0; padding-left: 20px; font-weight: 400; font-size: 15px; line-height: 1.6; }
.box .seg { display: inline-flex; }
.promise { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.promise span { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 14px; background: rgba(255, 244, 228, .06); font-size: 14px; }
.promise svg { width: 18px; height: 18px; color: var(--mint); }
.foot { text-align: center; color: var(--dim); font-weight: 400; font-size: 13px; padding: 10px 18px 0; }
.foot a { text-decoration: underline; }

/* ---------------------------------------------------------------- tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; padding: 8px 12px calc(8px + var(--sb)); background: rgba(28, 15, 8, .86); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabs .in { display: flex; width: min(100%, 520px); justify-content: space-around; }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 16px; border-radius: 16px; font-size: 13px; color: var(--dim); min-width: 84px; }
.tabs button svg { width: 26px; height: 26px; }
.tabs button.on { color: var(--sun); background: rgba(255, 196, 77, .12); }
.tabs .badge { position: absolute; }

/* ---------------------------------------------------------------- intro (first launch) */
#intro { position: fixed; inset: 0; z-index: 30; background: #000; display: none; overflow: hidden; touch-action: pan-y; }
#intro.on { display: block; }
#intro .slides { display: flex; height: 100%; transition: transform .5s var(--ease); }
#intro .slide { position: relative; flex: 0 0 100%; height: 100%; background: center 22%/cover; }
#intro .slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .15) 0%, rgba(28, 15, 8, 0) 30%, rgba(28, 15, 8, .85) 62%, var(--bg) 82%); }
#intro .slide .tx { position: absolute; left: 0; right: 0; bottom: calc(150px + var(--sb)); z-index: 1; padding: 0 28px; max-width: 560px; margin: 0 auto; }
#intro h2 { margin: 0 0 10px; font-family: var(--title); font-weight: 400; font-size: clamp(42px, 11vw, 58px); letter-spacing: .03em; line-height: .95; text-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
#intro h2 em { color: var(--sun); font-style: normal; }
#intro p { margin: 0; font-size: 19px; line-height: 1.4; color: rgba(255, 244, 228, .85); font-weight: 400; }
#intro .seg { display: inline-flex; margin-top: 16px; }
#intro .seg button { font-size: 16px; padding: 9px 16px; }
#intro .ctl { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 0 24px calc(26px + var(--sb)); max-width: 560px; margin: 0 auto; }
#intro .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
#intro .dots i { width: 9px; height: 9px; border-radius: 99px; background: rgba(255, 244, 228, .3); transition: width .3s var(--ease), background .3s; }
#intro .dots i.on { width: 28px; background: var(--sun); }
#intro .skip { position: absolute; top: calc(16px + var(--st)); right: 18px; z-index: 3; padding: 8px 14px; border-radius: 999px; background: rgba(0, 0, 0, .35); font-size: 15px; }
#intro .logo { position: absolute; top: calc(16px + var(--st)); left: 18px; z-index: 3; display: flex; align-items: center; gap: 10px; font-family: var(--title); font-weight: 400; font-size: 26px; letter-spacing: .05em; text-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
#intro .logo i { width: 38px; height: 38px; border-radius: 11px; background: url(icon-192.png) center/cover; box-shadow: 0 0 0 2px rgba(255, 196, 77, .6); }

/* ---------------------------------------------------------------- opening a story: the card grows to the full screen */
.zoom { position: fixed; z-index: 40; background: center/cover; border-radius: 22px; transition: all .45s var(--ease); pointer-events: none; }
.sheet { position: fixed; inset: 0; z-index: 25; display: none; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .55); }
.sheet.on { display: flex; }
.sheet .in { width: min(560px, 100%); padding: 24px 22px calc(24px + var(--sb)); border-radius: 26px 26px 0 0; background: var(--bg2); border: 1px solid var(--line); animation: up .35s var(--ease); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@media (min-width: 700px) { .card { flex-basis: 210px; } .hero { aspect-ratio: 16 / 9; } }

/* ================================================================ themes
   classic: the site's warm night (the first version). paper: a storybook by day (cream paper, white sticker cards
   with the title under the picture). night: a starry bedtime sky. pop: a comic-strip page (ink outlines, hard
   shadows, halftone dots). "auto" picks paper by day and night after 7 pm. Each series has its own colour (--sc). */
.card .im, .hero .im { position: absolute; inset: 0; background: var(--card) center/cover; }
.hero .im { background-position: center 30%; }
.s-lina { --sc: #2dbe7b; } .s-nala { --sc: #4c8dff; } .s-bible { --sc: #f2a33a; } .s-noel { --sc: #e0473c; }

:root[data-theme=paper] { --bg: #fff5e6; --bg2: #ffffff; --card: #f3e6d2; --line: rgba(45, 33, 80, .12); --ink: #2d2150; --dim: #6f668c; --sun: #ff7a45; --sun2: #ff5c8a; --mint: #2dbe7b; --sky: #4c8dff; --title: 'Fredoka', 'Nunito', system-ui, sans-serif; --ui: 'Nunito', system-ui, sans-serif; }
[data-theme=paper] body { font-weight: 800; background: radial-gradient(rgba(45, 33, 80, .07) 1.2px, transparent 1.7px) 0 0 / 18px 18px, radial-gradient(circle at 10% 4%, #ffd9b8 0, rgba(255, 217, 184, 0) 36%), radial-gradient(circle at 95% 22%, #d6efff 0, rgba(214, 239, 255, 0) 32%), var(--bg); }
[data-theme=paper] .top { background: linear-gradient(180deg, var(--bg) 72%, rgba(255, 245, 230, 0)); }
[data-theme=paper] .top .hi b, [data-theme=paper] .rail-h h3, [data-theme=paper] .ttl, [data-theme=paper] .album h3 { letter-spacing: 0; font-weight: 700; }
[data-theme=paper] .top .hi b { font-size: 29px; }
[data-theme=paper] .seg { background: #fff; box-shadow: 0 3px 10px rgba(45, 33, 80, .08); } [data-theme=paper] .seg button.on { background: var(--ink); color: #fff; }
[data-theme=paper] .hero { border: 6px solid #fff; border-radius: 30px; box-shadow: 0 18px 40px rgba(255, 122, 69, .22), 0 3px 0 rgba(45, 33, 80, .06); }
[data-theme=paper] .hero .kick { background: var(--sun); color: #fff; } [data-theme=paper] .hero h2 { letter-spacing: 0; font-weight: 700; font-size: 36px; } [data-theme=paper] .hero h2 em { color: #ffe08a; font-weight: 800; }
[data-theme=paper] .hero .play { color: #fff; box-shadow: 0 6px 0 #d9572b, 0 12px 24px rgba(255, 122, 69, .35); }
[data-theme=paper] .rail-h h3 { display: flex; align-items: center; gap: 10px; font-size: 27px; } [data-theme=paper] .rail-h h3::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sc) 25%, transparent); }
[data-theme=paper] .card { aspect-ratio: auto; background: #fff; padding: 7px 7px 2px; border-radius: 24px; box-shadow: 0 12px 26px rgba(45, 33, 80, .14); transform: rotate(-1.2deg); }
[data-theme=paper] .card:nth-child(even) { transform: rotate(1.3deg); }
[data-theme=paper] .card::after { display: none; }
[data-theme=paper] .card .im { position: relative; display: block; inset: auto; aspect-ratio: 3 / 3.5; border-radius: 18px; }
[data-theme=paper] .card .tx { position: static; padding: 10px 6px 12px; }
[data-theme=paper] .card h4 { letter-spacing: 0; font-weight: 700; font-size: 23px; color: var(--ink); } [data-theme=paper] .card h4 em { color: var(--sc); font-weight: 800; font-family: var(--ui); }
[data-theme=paper] .chip { background: rgba(45, 33, 80, .07); } [data-theme=paper] .chip.new { background: var(--sun2); color: #fff; } [data-theme=paper] .chip.done { background: var(--mint); color: #fff; }
[data-theme=paper] .card .ep { top: 14px; left: 14px; background: #fff; color: var(--ink); } [data-theme=paper] .card .st { top: 14px; right: 14px; background: #fff; border: 0; }
[data-theme=paper] .card .prog { position: static; margin: -4px 6px 12px; background: rgba(45, 33, 80, .1); }
[data-theme=paper] .album, [data-theme=paper] .box, [data-theme=paper] .meter, [data-theme=paper] .item { background: #fff; box-shadow: 0 10px 24px rgba(45, 33, 80, .08); }
[data-theme=paper] .album { border: 2px dashed rgba(45, 33, 80, .16); } [data-theme=paper] .album .h span { color: var(--sun); }
[data-theme=paper] .stickers i { border-color: rgba(45, 33, 80, .2); color: rgba(45, 33, 80, .3); background-color: #fff8ee; }
[data-theme=paper] .tabs { left: 14px; right: 14px; bottom: calc(10px + var(--sb)); padding: 6px; border-radius: 28px; background: rgba(255, 255, 255, .94); border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(45, 33, 80, .18); }
[data-theme=paper] .tabs button.on { background: var(--sun); color: #fff; }
[data-theme=paper] .btn { color: #fff; box-shadow: 0 5px 0 #d9572b; } [data-theme=paper] .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 4px 0 rgba(45, 33, 80, .12); }
[data-theme=paper] .offline-note { background: #e6f1ff; border-color: #bcd6ff; }

const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const Q = new URLSearchParams(location.search);
const THEMES = ['auto', 'paper', 'night', 'pop', 'classic'];
function theme() { let t = Q.get('theme') || (() => { try { return localStorage.getItem('contes-theme'); } catch { return null; } })() || 'auto'; if (t === 'auto') { const h = new Date().getHours(); t = h >= 19 || h < 7 ? 'night' : 'paper'; } document.documentElement.dataset.theme = t; document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#1c0f08'; }
theme();
let lang = Q.get('lang') || store.get('contes-lang') || ((navigator.language || '').startsWith('fr') ? 'fr' : 'en');
const inApp = true; // this page is the installed app's home (the web library is index.html)
try { sessionStorage.setItem('contes-inapp', '1'); } catch {}
const android = /Android/.test(navigator.userAgent);
const $ = (s) => document.querySelector(s);
const buzz = () => { try { navigator.vibrate?.(8); } catch {} };
const ICON = {
  dl: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  ok: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  del: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
};

// ------------------------------------------------------------------ offline state
let F = null; const state = {}; const byId = (id) => F?.tales?.find((x) => x.id === id);
const mb = (b) => `${Math.max(1, Math.round(b / 1e6))} ${T[lang].mb}`;
async function get(id) {
  const t = byId(id); if (!t || typeof state[id] === 'number' || !navigator.onLine) return;
  state[id] = 0; paint();
  try { await download(t, (p) => { state[id] = p; paint(); }); state[id] = 'ready'; buzz(); } catch (e) { console.warn(e); state[id] = 'none'; }
  paint();
}
async function drop(id) { const t = byId(id); if (!t || !confirm(T[lang].delq)) return; await remove(t); state[id] = 'none'; paint(); }

// ------------------------------------------------------------------ drawing
const prog = () => { try { return JSON.parse(localStorage.getItem('contes-prog') || '{}'); } catch { return {}; } };
const kid = () => (store.get('contes-kid') || '').trim();
function greet() { const n = kid(); if (n) { const h = new Date().getHours(); const g = lang === 'fr' ? (h < 5 || h >= 18 ? 'Bonsoir' : 'Bonjour') : (h < 12 ? 'Good morning' : h < 18 ? 'Hello' : 'Good evening'); return `${g} ${n} !`.replace(' !', lang === 'fr' ? ' !' : '!'); } const h = new Date().getHours(); return h < 5 || h >= 20 ? T[lang].night : h < 12 ? T[lang].morning : h < 18 ? T[lang].after : T[lang].evening; }
const stIcon = (id) => { const s = state[id]; return s === 'ready' ? `<span class="st ready">${ICON.ok}</span>` : typeof s === 'number' ? `<span class="st"><i class="ring" style="--p:${s}"></i></span>` : ''; };
function home() {
  const P = prog(), L = T[lang];
  const going = ALL.filter((t) => P[t.id]?.at > 0).sort((a, b) => P[b.id].t - P[a.id].t)[0]; // a story left in the middle
  const last = going || ALL.find((t) => t.id === store.get('contes-last')), h = last || ALL.find((t) => !P[t.id]) || ALL[0];
  const hero = $('#hero'); hero.dataset.id = h.id; hero.href = `${h.id}/?lang=${lang}`; hero.style.backgroundImage = 'none'; hero.dataset.img = h.img;
  hero.className = 'hero press' + (state[h.id] === 'ready' ? '' : ' net');
  const hp = going && P[h.id]; hero.innerHTML = `<i class="im" style="background-image:url(${h.img})"></i><div class="tx"><span class="kick">${last ? L.cont : L.feat}${hp ? ` · ${L.page} ${hp.at + 1}/${hp.of}` : ''}</span><h2>${h[lang].t}<em>${h[lang].s}</em></h2>${hp ? `<div class="bar"><i style="width:${Math.round(((hp.at + 1) / hp.of) * 100)}%"></i></div>` : ''}</div><span class="play" aria-label="${L.listen}">${ICON.play}</span>`;
  $('#rails').innerHTML = SERIES.map((s) => `<section class="rail s-${s.id}"><div class="rail-h"><h3>${s[lang].name}</h3><span>${s.tales.length} ${s.tales.length > 1 ? L.stories : L.story}</span></div><p>${s[lang].d}</p>
    <div class="row">${s.tales.map((t) => `<a class="card press s-${s.id}${state[t.id] === 'ready' ? '' : ' net'}" data-id="${t.id}" href="${t.id}/?lang=${lang}"><i class="im" style="background-image:url(${t.img})"></i>
      ${t.ep ? `<span class="chip ep">${L.ep} ${t.ep}</span>` : ''}${stIcon(t.id)}
      <div class="tx"><h4>${t[lang].t}<em>${t[lang].s}</em></h4><div class="meta"><span class="chip">${t.min} ${L.min}</span>${P[t.id]?.at > 0 ? `<span class="chip pg">${P[t.id].at + 1}/${P[t.id].of}</span>` : P[t.id]?.done ? `<span class="chip done">✓ ${L.readb}</span>` : P[t.id] ? '' : `<span class="chip new">${L.newb}</span>`}</div></div>
      ${P[t.id]?.at > 0 ? `<span class="prog"><i style="width:${Math.round(((P[t.id].at + 1) / P[t.id].of) * 100)}%"></i></span>` : ''}</a>`).join('')}</div></section>`).join('')
    + `<section class="album"><div class="h"><h3>${L.albumT}</h3><span>${ALL.filter((t) => P[t.id]?.done).length} / ${ALL.length}</span></div><p>${L.albumS}</p>
      <div class="stickers">${ALL.map((t) => P[t.id]?.done ? `<i class="got" style="background-image:url(${t.img})" title="${t[lang].t} ${t[lang].s}"></i>` : '<i>?</i>').join('')}</div></section>`;
}
function offline() {
  const L = T[lang], ts = F?.tales || [], ready = ts.filter((t) => state[t.id] === 'ready'), left = ts.filter((t) => state[t.id] !== 'ready');
  $('#m-n').textContent = `${ready.length} ${L.of} ${ts.length} ${L.onphone}`; $('#m-mb').textContent = mb(ready.reduce((s, t) => s + t.size, 0));
  $('#m-bar').style.width = ts.length ? `${(ready.length / ts.length) * 100}%` : '0';
  const b = $('#dlall'); b.disabled = !left.length || !navigator.onLine || ts.some((t) => typeof state[t.id] === 'number');
  b.innerHTML = left.length ? `${ICON.dl}${L.all} · ${mb(left.reduce((s, t) => s + t.size, 0))}` : `${ICON.ok}${L.allok}`;
  $('#offlist').innerHTML = ALL.map((x) => { const t = byId(x.id); if (!t) return ''; const s = state[x.id];
    const act = s === 'ready' ? `<button class="act del press" data-del="${x.id}" aria-label="${L.del}">${ICON.del}</button>` : typeof s === 'number' ? `<span class="act"><i class="ring" style="--p:${s}"></i></span>` : `<button class="act press" data-get="${x.id}" aria-label="${L.dl}">${ICON.dl}</button>`;
    return `<div class="item"><i class="th" style="background-image:url(${x.img})"></i><div class="tx"><b>${x[lang].t} ${x[lang].s}</b><small>${s === 'ready' ? L.ready : typeof s === 'number' ? Math.round(s * 100) + ' %' : mb(t.size)} · ${x.min} ${L.min}</small></div>${act}</div>`; }).join('');
}
function paint() { if (F) { home(); offline(); } }
function render() {
  document.documentElement.lang = lang; const L = T[lang];
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = L[el.dataset.t];
  for (const el of document.querySelectorAll('[data-h]')) el.innerHTML = L[el.dataset.h];
  for (const b of document.querySelectorAll('[data-lang]')) b.classList.toggle('on', b.dataset.lang === lang);
  $('#greet').textContent = greet(); $('#ver').textContent = `${L.app} ${VERSION}`; $('#kid').placeholder = L.nameP;
  home(); offline(); intro.draw();
}
function setLang(l) { lang = l; store.set('contes-lang', l); buzz(); render(); }
document.addEventListener('click', (e) => { const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang); });

// ------------------------------------------------------------------ tabs
function tab(v) {
  for (const b of document.querySelectorAll('.tabs button')) b.classList.toggle('on', b.dataset.v === v);
  for (const s of document.querySelectorAll('.view')) s.classList.toggle('on', s.id === 'v-' + v);
  scrollTo({ top: 0 }); history.replaceState(null, '', v === 'home' ? location.pathname + location.search : '#' + v);
}
for (const b of document.querySelectorAll('.tabs button')) b.onclick = () => { buzz(); tab(b.dataset.v); };
const fromHash = () => tab(['off', 'par'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home');
if (location.hash) fromHash();
addEventListener('hashchange', fromHash);

// ------------------------------------------------------------------ opening a story: remember it, and grow its picture to the screen
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-get]'), d = e.target.closest('[data-del]');
  if (g) { e.preventDefault(); get(g.dataset.get); return; } if (d) { e.preventDefault(); drop(d.dataset.del); return; }
  const a = e.target.closest('a.card, a.hero'); if (!a || e.ctrlKey || e.metaKey) return;
  if (!navigator.onLine && state[a.dataset.id] !== 'ready') { e.preventDefault(); a.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 300 }); return; }
  e.preventDefault(); buzz(); store.set('contes-last', a.dataset.id);
  const src = a.querySelector('.im') || a, r = src.getBoundingClientRect(), z = document.createElement('div'); z.className = 'zoom';
  z.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;background-image:${getComputedStyle(src).backgroundImage}`;
  document.body.append(z); requestAnimationFrame(() => requestAnimationFrame(() => { z.style.left = '0px'; z.style.top = '0px'; z.style.width = innerWidth + 'px'; z.style.height = innerHeight + 'px'; z.style.borderRadius = '0'; }));
  setTimeout(() => { location.href = a.href; }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 420);
  setTimeout(() => z.remove(), 3000);
});
addEventListener('pageshow', (e) => { if (e.persisted) { document.querySelectorAll('.zoom').forEach((z) => z.remove()); home(); } });

// ------------------------------------------------------------------ the welcome (first launch, or from the parents' tab)
const intro = (() => {
  const SL = [{ img: 'lina/art/l10.jpg', pos: '72% 62%', t: 's1t', p: 's1p', lang: true }, { img: 'nala/art/k3.jpg', pos: '50% 30%', t: 's2t', p: 's2p' }, { img: 'noe/art/n5.jpg', pos: '50% 25%', t: 's3t', p: 's3p' }];
  let i = 0, x0 = null; const el = $('#intro'), sl = $('#slides');
  const draw = () => {
    const L = T[lang];
    sl.innerHTML = SL.map((s) => `<div class="slide" style="background-image:url(${s.img});background-position:${s.pos}"><div class="tx"><h2>${L[s.t]}</h2><p>${L[s.p]}</p>${s.lang ? '<div class="seg"><button data-lang="fr" class="' + (lang === 'fr' ? 'on' : '') + '">Français</button><button data-lang="en" class="' + (lang === 'en' ? 'on' : '') + '">English</button></div>' : ''}</div></div>`).join('');
    $('#idots').innerHTML = SL.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
    sl.style.transform = `translateX(${-i * 100}%)`; $('#inext').textContent = i === SL.length - 1 ? L.go : L.next;
  };
  const go = (k) => { i = Math.max(0, Math.min(SL.length - 1, k)); draw(); };
  const close = () => { el.classList.remove('on'); store.set('contes-intro', '1'); buzz(); };
  $('#inext').onclick = () => { buzz(); i === SL.length - 1 ? close() : go(i + 1); };
  $('#skip').onclick = close;
  el.addEventListener('pointerdown', (e) => { x0 = e.clientX; });
  el.addEventListener('pointerup', (e) => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) go(i + (dx < 0 ? 1 : -1)); });
  addEventListener('keydown', (e) => { if (!el.classList.contains('on')) return; if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); if (e.key === 'Escape') close(); });
  return { draw, open: () => { i = 0; draw(); el.classList.add('on'); } };
})();
$('#replayintro').onclick = () => intro.open();
const themeBtns = () => { let t = 'auto'; try { t = localStorage.getItem('contes-theme') || 'auto'; } catch {} for (const b of document.querySelectorAll('[data-th]')) b.classList.toggle('on', b.dataset.th === t); };
for (const b of document.querySelectorAll('[data-th]')) b.onclick = () => { try { localStorage.setItem('contes-theme', b.dataset.th); } catch {} buzz(); theme(); themeBtns(); };
themeBtns();
document.addEventListener('visibilitychange', () => { if (!document.hidden) theme(); }); // coming back at 7 pm: the night has come
const kidIn = $('#kid'); kidIn.value = kid(); kidIn.oninput = () => { store.set('contes-kid', kidIn.value.replace(/[<>&"]/g, '')); $('#greet').textContent = greet(); };
if (!store.get('contes-intro') && !Q.has('nointro')) intro.open();

// ------------------------------------------------------------------ installing: Android gets the app file, iPhone the steps, other browsers their own prompt
if (inApp) document.body.classList.add('app');
$('#b-android').hidden = inApp || ios; $('#b-ios').hidden = !ios || standalone;
let deferred = null; $('#b-pwa').hidden = true;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; if (!android && !inApp) $('#b-pwa').hidden = false; });
$('#inst').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; $('#b-pwa').hidden = true; };
for (const w of document.querySelectorAll('.web')) w.hidden = inApp;

// ------------------------------------------------------------------ network
const net = () => { document.body.classList.toggle('offline', !navigator.onLine); paint(); };
addEventListener('online', net); addEventListener('offline', net);
document.body.classList.toggle('offline', !navigator.onLine);
render();
(async () => {
  if (!canOffline) return;
  await register(); F = await files(); if (!F.tales) return;
  for (const t of F.tales) state[t.id] = await status(t);
  paint();
  for (const t of F.tales) if (state[t.id] === 'old') get(t.id); // a story changed: the new version replaces the old one by itself
})();
window.__contes = { state, get files() { return F; }, get, tab, intro };
</script>
