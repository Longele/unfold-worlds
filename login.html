<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Unfold Worlds</title>
<meta name="theme-color" content="#07090d">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="portal.css">
<style>
  .center { min-height: calc(100vh - 90px); display: grid; place-items: center; padding: 20px 0 60px; }
  .panel { width: min(440px, 100%); text-align: center; }
  .panel h1 { font-weight: 300; font-size: 44px; margin: 6px 0 6px; }
  .panel .lead { color: var(--dim); font-style: italic; font-size: 19px; margin: 0 0 26px; }
  #send, #forgot { width: 100%; }
  #forgot { margin-top: 10px; }
  .field { text-align: left; }
  .note { margin-top: 22px; font-size: 10px; text-transform: none; letter-spacing: .04em; line-height: 1.7; }
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="veil"></div>
<div class="wrap">
  <header class="top"><a class="logo" href="./"><i></i><b>UNFOLD WORLDS</b></a></header>
  <div class="center">
    <div class="panel">
      <div class="mono">Espace membres</div>
      <h1>Connexion</h1>
      <p class="lead">Retrouvez vos présentations.</p>
      <form id="f">
        <div class="field"><label for="email">Adresse e-mail</label><input class="input" id="email" type="email" autocomplete="email" required placeholder="vous@exemple.com"></div>
        <div class="field"><label for="pw">Mot de passe</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
        <button class="btn gold" id="send">SE CONNECTER</button>
        <button type="button" class="btn" id="forgot">MOT DE PASSE OUBLIÉ ?</button>
      </form>
      <div class="msg" id="msg"></div>
      <div class="mono note">Les comptes sont créés par l’administrateur. Sans compte, vous pouvez <a href="./#cours" style="color:var(--acc2)">explorer les cours gratuits</a>.</div>
    </div>
  </div>
</div>
<script src="lib/supabase.js"></script>
<script type="module">
import { sb } from './config.js';
import { setBg } from './bg.js';
setBg({ hue: [255, 122, 26], fx: 0.5, fy: 0.42, mode: 'orbit', pull: 0.6, speed: 0.5 });
const back = new URL('app.html', location.href).href;
const msg = document.getElementById('msg');
const say = (t, cls = '') => { msg.textContent = t; msg.className = 'msg ' + cls; };

const { data: { session } } = await sb().auth.getSession();
if (session) location.replace(back);

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim(), password = document.getElementById('pw').value;
  const b = document.getElementById('send'); b.disabled = true; say('connexion…');
  const { error } = await sb().auth.signInWithPassword({ email, password });
  b.disabled = false;
  if (error) say(/invalid/i.test(error.message) ? 'E-mail ou mot de passe incorrect.' : error.message, 'bad');
  else location.replace(back);
};
// a reset link signs you in and opens "choose your password" (it never creates an account)
document.getElementById('forgot').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) { say('Entrez votre e-mail d’abord.', 'bad'); return; }
  const b = document.getElementById('forgot'); b.disabled = true; say('envoi…');
  const { error } = await sb().auth.resetPasswordForEmail(email, { redirectTo: back });
  b.disabled = false;
  if (error) say(/rate|security|seconds/i.test(error.message) ? 'Un e-mail vient déjà de partir : patientez une minute avant de redemander.' : error.message, 'bad');
  else say('Si ce compte existe, un e-mail est parti. Cliquez sur le lien pour choisir un nouveau mot de passe.', 'ok');
};
</script>
</body>
</html>
