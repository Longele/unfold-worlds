<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vue orateur · Unfold Worlds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225%22 fill=%22%23ff7a1a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  * { cursor: auto !important; }
  html, body { overflow: auto; background: #0b0d12; }
  body { padding: 28px 36px; display: grid; grid-template-columns: 1fr 380px; gap: 36px; height: 100vh; }
  h1 { font-weight: 300; font-size: 58px; margin: 6px 0 4px; line-height: 1.05; }
  .row { display: flex; gap: 28px; align-items: baseline; }
  .clock { font-family: var(--mono); font-size: 46px; color: var(--fg); }
  .clock.over { color: #ff7a1a; }
  .notes { font-size: 30px; line-height: 1.45; color: var(--fg); margin: 22px 0; max-width: 34em; }
  .next { color: var(--fg-dim); font-size: 26px; font-style: italic; }
  .steps { display: flex; gap: 8px; margin-top: 10px; }
  .steps i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--fg-faint); }
  .steps i.on { background: #ff7a1a; border-color: #ff7a1a; }
  ol { list-style: none; margin: 0; padding: 0; overflow: auto; height: calc(100vh - 56px); }
  li { padding: 9px 12px; border-left: 2px solid transparent; font-size: 20px; color: var(--fg-dim); cursor: pointer !important; display: flex; justify-content: space-between; gap: 12px; }
  li:hover { background: rgba(255,255,255,.04); }
  li.cur { border-color: #ff7a1a; color: var(--fg); background: rgba(255,122,26,.08); }
  li .m { font-family: var(--mono); font-size: 13px; opacity: .6; white-space: nowrap; }
  .parts { display: flex; gap: 18px; margin-top: 24px; }
  .part { flex: 1; border-top: 2px solid var(--line); padding-top: 10px; font-family: var(--mono); font-size: 14px; letter-spacing: .12em; color: var(--fg-dim); text-transform: uppercase; }
  .part.cur { border-color: #ff7a1a; color: var(--fg); }
  .part b { display: block; font-size: 26px; font-weight: 400; margin-top: 4px; letter-spacing: 0; }
  .btns { display: flex; gap: 12px; margin-top: 26px; }
  .btns button { font-family: var(--mono); font-size: 15px; letter-spacing: .2em; padding: 14px 26px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer !important; }
  .btns button:hover { background: rgba(255,255,255,.06); }
  .help { margin-top: 26px; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--fg-faint); line-height: 1.9; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; height: auto; min-height: 100vh; padding: 18px 16px; gap: 18px; }
    h1 { font-size: 40px; }
    .notes { font-size: 24px; }
    .parts { flex-wrap: wrap; }
    ol { height: auto; max-height: none; }
    .btns { flex-wrap: wrap; }
    .btns button { flex: 1; }
  }
</style>
</head>
<body>
<main>
  <div class="row"><span class="mono" id="pos">en attente de la présentation…</span></div>
  <h1 id="title">·</h1>
  <div class="steps" id="steps"></div>
  <div class="row" style="margin-top:22px"><span class="clock" id="elapsed">00:00</span><span class="mono" id="slot"></span></div>
  <div class="notes" id="notes"></div>
  <div class="next" id="next"></div>
  <div class="parts" id="parts"></div>
  <div class="btns"><button id="bp">◀ PRÉC.</button><button id="bn">SUIV. ▶</button><button id="bb">ÉCRAN NOIR</button></div>
  <div class="help">Télécommande / → ↓ PageDown Espace : suivant · ← ↑ PageUp : précédent · B ou . : écran noir<br>Clic gauche : suivant · clic droit : précédent · M : son · F : plein écran · numéro + G : aller à la scène</div>
</main>
<ol id="list"></ol>
<script>
  const bc = new BroadcastChannel('grandir-pres');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  let BUDGET = {}, NAMES = {};
  let st = null, sceneT = Date.now(), lastIdx = -1;
  const mmss = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  bc.onmessage = (e) => {
    if (e.data.type !== 'state') return;
    st = e.data; NAMES = st.parts || NAMES; BUDGET = st.budgets || BUDGET; const sc = st.scenes[st.idx], nx = st.scenes[st.idx + 1];
    if (st.idx !== lastIdx) { sceneT = Date.now(); lastIdx = st.idx; }
    $('pos').textContent = `scène ${st.idx + 1} / ${st.scenes.length} · point ${st.step + 1} / ${sc.steps}`;
    $('title').textContent = sc.title;
    $('steps').innerHTML = Array.from({ length: sc.steps }, (_, i) => `<i class="${i <= st.step ? 'on' : ''}"></i>`).join('');
    $('notes').textContent = sc.notes || '';
    $('next').textContent = st.step < sc.steps - 1 ? 'Clic suivant : point suivant' : nx ? `Ensuite : ${nx.title}` : 'Fin';
    $('list').innerHTML = st.scenes.map((s, i) => `<li data-i="${i}" class="${i === st.idx ? 'cur' : ''}"><span>${i + 1}. ${esc(s.title)}</span><span class="m">${s.min ? s.min + '′' : ''}</span></li>`).join('');
    $('list').querySelector('.cur')?.scrollIntoView({ block: 'center' });
    $('parts').innerHTML = Object.keys(NAMES).map(Number).map((p) => `<div class="part ${sc.part === p ? 'cur' : ''}">${esc(NAMES[p])}<b>${BUDGET[p] ? BUDGET[p] + ' min' : ''}</b></div>`).join('');
    $('slot').textContent = sc.min ? `· prévu ${sc.min} min pour cette scène` : '';
  };
  setInterval(() => {
    if (!st || !st.t0) return;
    $('elapsed').textContent = mmss(Date.now() - st.t0);
    const sc = st.scenes[st.idx];
    $('elapsed').classList.toggle('over', sc.min && Date.now() - sceneT > sc.min * 60000);
  }, 500);
  const cmd = (c, extra = {}) => bc.postMessage({ type: 'cmd', cmd: c, ...extra });
  $('bn').onclick = () => cmd('next'); $('bp').onclick = () => cmd('prev'); $('bb').onclick = () => cmd('black');
  $('list').onclick = (e) => { const li = e.target.closest('li'); if (li) cmd('go', { idx: +li.dataset.i }); };
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); cmd('next'); }
    if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); cmd('prev'); }
    if (['b', 'B', '.'].includes(e.key)) cmd('black');
  });
  bc.postMessage({ type: 'hello' });
</script>
</body>
</html>
