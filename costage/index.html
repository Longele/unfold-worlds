<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>CO-STAGE</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="costage.css">
</head>
<body class="phone">
<div id="glow"></div>
<div class="ph-top mono" id="top">CO-STAGE</div>

<section class="ph" id="code"><h1>CO-STAGE</h1><div class="word"><input id="code-in" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn gold" id="code-go">OK</button></div></section>
<section class="ph" id="conn"><div class="pocket"><i class="dot"></i></div><p id="conn-t"></p></section>
<section class="ph" id="join"><div class="mono" id="j-k"></div><h1 id="j-a"></h1><p id="j-t"></p>
  <div class="map"><div class="stage" id="j-stage"></div><div class="zones"><button data-z="g"></button><button data-z="c"></button><button data-z="d"></button></div></div></section>
<section class="ph pocket" id="pocket"><i class="dot"></i><h2 id="pk-a"></h2><p id="pk-t"></p><div class="small" id="pk-s"></div></section>
<section class="ph" id="mo"></section>

<div class="msgbar" id="msg"></div>
<script type="module" src="phone.js"></script>
</body>
</html>
